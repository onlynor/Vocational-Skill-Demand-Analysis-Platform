server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    # Reverse-proxy /api/* to the backend service (Docker Compose service
    # name "backend"). The trailing slash on both sides matters: nginx
    # forwards the remainder after the matched /api/ prefix onto the same
    # /api/ prefix on the upstream, so /api/auth/login -> backend:8000/api/auth/login.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Long-cache fingerprinted build assets (Vite hashes filenames on every
    # build, so this is safe — a new deploy always gets new filenames).
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: unknown paths (client-side vue-router routes) serve
    # index.html instead of a 404, so a hard refresh on e.g. /jobs works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
